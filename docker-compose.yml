services:
  postgres_db:

    image: postgres:16
    container_name: postgres

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: pdv_sales
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/data-storage/postgres/init:/docker-entrypoint-initdb.d

volumes: 
  postgres_data: